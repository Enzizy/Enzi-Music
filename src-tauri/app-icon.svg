<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F1F"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <!-- Monochrome: a near-black tile with a hairline edge, so it still reads on a black taskbar. -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="16"/>
  <!-- An E drawn as a sound level meter: a stem and three bars of different lengths. -->
  <g fill="#FFFFFF">
    <rect x="300" y="292" width="80" height="440" rx="40"/>
    <rect x="300" y="292" width="424" height="80" rx="40"/>
    <rect x="300" y="472" width="280" height="80" rx="40"/>
    <rect x="300" y="652" width="360" height="80" rx="40"/>
  </g>
</svg>
